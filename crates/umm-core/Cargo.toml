[package]
name = "umm-core"
description = "The Session API shared by the UMM CLI and app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
umm-gamedef.workspace = true
umm-store.workspace = true
umm-deploy.workspace = true
thiserror.workspace = true
umm-launch.workspace = true
umm-thunderstore.workspace = true
umm-nexus.workspace = true
umm-fomod.workspace = true
md-5 = "0.10"
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
same-file.workspace = true
walkdir.workspace = true
globset.workspace = true
base64 = "0.22"

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
flate2 = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg.workspace = true
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
