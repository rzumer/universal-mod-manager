[package]
name = "umm-core"
description = "The Session API shared by the UMM CLI and app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
umm-gamedef.workspace = true
umm-store.workspace = true
umm-deploy.workspace = true
thiserror.workspace = true
umm-launch.workspace = true
umm-sources.workspace = true
toml.workspace = true
umm-fomod.workspace = true
md-5 = "0.10"
sha2 = "0.10"
zip.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
same-file.workspace = true
walkdir.workspace = true
globset.workspace = true
# xdelta3 patches' LZMA secondary compression (already in the tree through 7z support).
lzma-rust2 = { version = "0.16", default-features = false, features = ["std"] }
flate2 = "1"
ruzstd = "0.7"
roxmltree = "0.20"

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
